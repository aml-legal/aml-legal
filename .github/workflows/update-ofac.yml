name: Update OFAC crypto-address snapshot

on:
  schedule:
    # 04:15 UTC daily — after the upstream mirror's own nightly re-sync from
    # OFAC's file. Adjust if the mirror's sync schedule changes.
    - cron: "15 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run update script
        run: node scripts/update-ofac.mjs

      - name: Rebuild minified app.js
        run: npx --yes terser app.js -o app.min.js --compress --mangle

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- app.js app.min.js index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Opens a PR instead of pushing straight to main, so a human reviews
      # the diff before a freshly-sanctioned or newly-delisted address goes
      # live — this data feeds real screening decisions.
      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: refresh OFAC crypto-address snapshot"
          title: "Automated OFAC snapshot refresh"
          body: |
            Automated nightly refresh of `OFAC_CRYPTO_ADDRESSES_EXT` and
            `OFAC_PULL_DATE` in `app.js` (source) and `app.min.js`
            (rebuilt via terser), plus the address-count mentions and
            cache-busting query string in `index.html`, generated by
            `scripts/update-ofac.mjs`.

            Please skim the address-count delta before merging — a large
            unexpected drop usually means the upstream fetch failed rather
            than a mass delisting.
          branch: automated/ofac-refresh
          delete-branch: true
